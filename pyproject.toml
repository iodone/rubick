[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rub"
dynamic = ["version"]
description = "Universal API CLI — discover, inspect, and invoke any protocol through a single interface"
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pluggy>=1.3",
    "aiosqlite>=0.19",
    "rich>=13.0",
    "loguru>=0.7.2",
]

[project.scripts]
rub = "rub.__main__:app"
rub-install-skills = "rub._install_skills:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-asyncio>=0.23",
    "black>=24.0",
]

[tool.setuptools.dynamic]
version = {attr = "rub.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rub*", "skills*"]

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.uv]
index-url = "https://pkgs.d.xiaomi.net/artifactory/api/pypi/pypi-virtual/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
